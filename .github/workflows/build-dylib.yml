name: Build BiliBiliMDDylib

on:
  workflow_dispatch:
  push:
    paths:
      - "BiliBiliMDDylib/**"
      - ".github/workflows/build-dylib.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # MonkeyDev 的 md 工具是 x86_64，Apple Silicon runner 需要 Rosetta
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install theos
        run: |
          # md 脚本硬编码查找 $HOME/theos/bin/logos.pl，
          # 项目 build setting 又要求 /opt/theos，因此装一份 + 软链
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          sudo ln -sfn "$HOME/theos" /opt/theos
          ls -l "$HOME/theos/bin/logos.pl"
          ls /opt/theos/vendor/include | head -3

      - name: Install MonkeyDev
        run: |
          git clone --depth 1 https://github.com/AloneMonkey/MonkeyDev.git /tmp/md
          sudo mkdir -p /opt/MonkeyDev
          sudo cp -R /tmp/md/. /opt/MonkeyDev/
          sudo chmod -R +x /opt/MonkeyDev/bin /opt/MonkeyDev/Tools || true
          file /opt/MonkeyDev/bin/md || true

      - name: Build Dylib
        env:
          THEOS: /opt/theos
        run: |
          set -o pipefail
          xcodebuild -project BiliBiliMD.xcodeproj \
            -target BiliBiliMDDylib \
            -configuration Release \
            SYMROOT="$PWD/out" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: |
            out/*.dylib
            build.log
